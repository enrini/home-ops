title = "home-ops gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow SOPS encrypted values"
regexTarget = "line"
regexes = [
  '''ENC\[AES256_GCM,data:[^,]+,iv:[^,]+,tag:[^,]+,type:[^\]]+\]''',
]

[[allowlists]]
description = "Allow Age public recipient keys"
regexTarget = "line"
regexes = [
  '''age1[a-z0-9]{58}''',
]
