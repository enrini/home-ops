---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  interval: 1h
  values:
    prometheus:
      enable: true
    worker:
      config:
        core:
          sources:
            - pci
            - custom
        sources:
          pci:
            deviceClassWhitelist:
              - "0200"
              - "0207"
              - "0300"
              - "0302"
              - "0c03"
              - "1140"
            deviceLabelFields:
              - class
              - vendor
              - device
