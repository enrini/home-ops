---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: loki
  valuesFrom:
    - kind: ConfigMap
      name: loki-bucket
      valuesKey: BUCKET_NAME
      targetPath: loki.storage.bucketNames.chunks
    - kind: ConfigMap
      name: loki-bucket
      valuesKey: BUCKET_NAME
      targetPath: loki.storage.bucketNames.ruler
    - kind: ConfigMap
      name: loki-bucket
      valuesKey: BUCKET_NAME
      targetPath: loki.storage.bucketNames.admin
    - kind: Secret
      name: loki-bucket
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-bucket
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: loki.storage.s3.secretAccessKey
  values:
    deploymentMode: SimpleScalable
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      commonConfig:
        replication_factor: 2
      compactor:
        working_directory: /var/loki/compactor/retention
        delete_request_store: s3
        retention_enabled: true
      limits_config:
        retention_period: 30d
        allow_structured_metadata: true
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        s3:
          endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local:80
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
    singleBinary:
      replicas: 0
    write:
      replicas: 2
      persistence:
        storageClass: ceph-block
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    read:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    backend:
      replicas: 2
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    chunksCache:
      enabled: true
      allocatedMemory: 512
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 768Mi
    resultsCache:
      enabled: true
      allocatedMemory: 256
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 384Mi
    monitoring:
      serviceMonitor:
        enabled: true
    lokiCanary:
      enabled: false
    test:
      enabled: false
