---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        strategy: Recreate
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: "1.37"
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -eu
                CONF_DIR="/config/qBittorrent"
                CONF="${CONF_DIR}/qBittorrent.conf"
                mkdir -p "$CONF_DIR"
                touch "$CONF"

                set_ini() {
                  SECTION="$1" KEY="$2" VAL="$3" awk '
                    BEGIN {
                      sec = ENVIRON["SECTION"]
                      key = ENVIRON["KEY"]
                      val = ENVIRON["VAL"]
                      in_sec = 0
                      seen_sec = 0
                      updated = 0
                    }
                    /^\[.*\]$/ {
                      if (in_sec && !updated) {
                        print key "=" val
                        updated = 1
                      }
                      in_sec = ($0 == "[" sec "]")
                      if (in_sec) seen_sec = 1
                      print
                      next
                    }
                    {
                      if (in_sec && index($0, key "=") == 1) {
                        print key "=" val
                        updated = 1
                        next
                      }
                      print
                    }
                    END {
                      if (!seen_sec) {
                        if (NR > 0) print ""
                        print "[" sec "]"
                        print key "=" val
                      } else if (in_sec && !updated) {
                        print key "=" val
                      }
                    }
                  ' "$CONF" > "${CONF}.tmp" && mv "${CONF}.tmp" "$CONF"
                }

                set_ini "Preferences" 'WebUI\AuthSubnetWhitelistEnabled' "true"
                set_ini "Preferences" 'WebUI\AuthSubnetWhitelist' "10.42.0.0/16"
                set_ini "Preferences" 'WebUI\LocalHostAuth' "false"
                set_ini "AutoRun" "enabled" "true"
                set_ini "AutoRun" "program" '/bin/sh /scripts/cross-seed.sh "%I"'
                set_ini "BitTorrent" 'Session\DefaultSavePath' "/data/torrents"
                set_ini "BitTorrent" 'Session\DisableAutoTMMByDefault' "false"
                set_ini "BitTorrent" 'Session\DisableAutoTMMTriggers\CategorySavePathChanged' "false"
                set_ini "BitTorrent" 'Session\DisableAutoTMMTriggers\DefaultSavePathChanged' "false"

                cat > "${CONF_DIR}/categories.json" <<'EOF'
                {
                  "anime": {
                    "save_path": "/data/torrents/anime"
                  },
                  "cross-seed": {
                    "save_path": "/data/torrents/cross-seed"
                  },
                  "movies": {
                    "save_path": "/data/torrents/movies"
                  },
                  "music": {
                    "save_path": "/data/torrents/music"
                  },
                  "tv": {
                    "save_path": "/data/torrents/tv"
                  }
                }
                EOF
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            restartPolicy: Always
            env:
              TZ: Europe/London
              VPN_TYPE: wireguard
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{ "{{PORTS}}" }}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
              FIREWALL_INPUT_PORTS: "8080"
              FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24"
            envFrom:
              - secretRef:
                  name: gluetun-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness: &gluetunProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *gluetunProbes
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - NET_ADMIN
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.1
            env:
              TZ: Europe/London
              QBT_WEBUI_PORT: &port 8080
              CROSS_SEED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: CROSS_SEED_API_KEY
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "qbit.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    configMaps:
      scripts:
        data:
          cross-seed.sh: |
            #!/bin/sh
            INFO_HASH="${1:-}"
            [ -z "$INFO_HASH" ] && exit 0
            [ -z "${CROSS_SEED_API_KEY:-}" ] && exit 0
            URL="http://cross-seed.media.svc.cluster.local:2468/api/webhook"
            if command -v curl >/dev/null 2>&1; then
              curl -fsS -X POST "$URL" -H "X-Api-Key: ${CROSS_SEED_API_KEY}" --data-urlencode "infoHash=${INFO_HASH}" >/dev/null 2>&1 || true
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O- --header="X-Api-Key: ${CROSS_SEED_API_KEY}" --post-data="infoHash=${INFO_HASH}" "$URL" >/dev/null 2>&1 || true
            fi
            exit 0
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      scripts:
        type: configMap
        identifier: scripts
        globalMounts:
          - path: /scripts
            readOnly: true
