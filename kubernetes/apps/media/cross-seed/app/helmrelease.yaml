---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cross-seed
spec:
  chartRef:
    kind: OCIRepository
    name: cross-seed
  interval: 1h
  values:
    controllers:
      cross-seed:
        strategy: Recreate
        initContainers:
          sync-indexers:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.9
            command:
              - node
              - -e
            args:
              - |
                const fs = require("fs");
                const path = "/config/torznab.json";
                const apiKey = process.env.PROWLARR_API_KEY;
                fs.mkdirSync("/config/xseeds", { recursive: true });
                (async () => {
                  try {
                    const res = await fetch("http://prowlarr.media.svc.cluster.local:9696/api/v1/indexer", {
                      headers: { "X-Api-Key": apiKey },
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const indexers = await res.json();
                    const urls = indexers
                      .filter((i) => i.enable && i.protocol === "torrent")
                      .map((i) => `http://prowlarr.media.svc.cluster.local:9696/${i.id}/api?apikey=${apiKey}`);
                    fs.writeFileSync(path, JSON.stringify(urls, null, 2));
                    console.log(`Synced ${urls.length} torrent indexer(s) from Prowlarr.`);
                  } catch (err) {
                    console.warn(`Failed to sync Prowlarr indexers (${err.message}); preserving existing torznab.json if present.`);
                    if (!fs.existsSync(path)) {
                      fs.writeFileSync(path, "[]");
                    }
                  }
                })();
            env:
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: arr-api-keys
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.9
            args:
              - daemon
            env:
              TZ: Europe/London
              CONFIG_DIR: /config
            envFrom:
              - secretRef:
                  name: arr-api-keys
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 2468
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 2468
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 2468
    configMaps:
      config:
        data:
          config.js: |
            const fs = require("fs");
            const torznabPath = "/config/torznab.json";
            const torznab = fs.existsSync(torznabPath)
              ? JSON.parse(fs.readFileSync(torznabPath, "utf8"))
              : [];

            module.exports = {
              apiKey: undefined,
              host: "0.0.0.0",
              port: 2468,
              torznab,
              radarr: [
                `http://radarr.media.svc.cluster.local:7878/?apikey=${process.env.RADARR_API_KEY}`,
              ],
              sonarr: [
                `http://sonarr.media.svc.cluster.local:8989/?apikey=${process.env.SONARR_API_KEY}`,
                `http://sonarr-anime.media.svc.cluster.local:8989/?apikey=${process.env.SONARR_ANIME_API_KEY}`,
              ],
              torrentClients: [
                "qbittorrent:http://qbittorrent.media.svc.cluster.local:8080",
              ],
              useClientTorrents: true,
              action: "inject",
              linkType: "hardlink",
              linkDirs: ["/data/torrents/cross-seed"],
              linkCategory: "cross-seed",
              flatLinking: false,
              matchMode: "partial",
              skipRecheck: true,
              duplicateCategories: false,
              includeSingleEpisodes: true,
              includeNonVideos: false,
              seasonFromEpisodes: 1,
              excludeOlder: "2 weeks",
              excludeRecentSearch: "3 days",
              snatchTimeout: "30 seconds",
              searchTimeout: "2 minutes",
              delay: 30,
              outputDir: "/config/xseeds",
              rssCadence: torznab.length > 0 ? "30 minutes" : null,
              searchCadence: torznab.length > 0 ? "1 day" : null,
            };
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/config.js
            subPath: config.js
            readOnly: true
      data:
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
