---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  values:
    controllers:
      sabnzbd:
        strategy: Recreate
        initContainers:
          init-config:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -eu
                INI="/config/sabnzbd.ini"
                [ -f "$INI" ] || touch "$INI"
                PY="python3"
                [ -x /app/venv/bin/python ] && PY="/app/venv/bin/python"
                "$PY" -c '
                import sys
                sys.path[:0] = ["/app"]
                from configobj import ConfigObj
                cfg = ConfigObj("/config/sabnzbd.ini", encoding="utf-8")
                misc = cfg.setdefault("misc", {})
                misc["download_dir"] = "/data/usenet/incomplete"
                misc["complete_dir"] = "/data/usenet/complete"
                cats = cfg.setdefault("categories", {})
                for name in ("movies", "tv", "anime", "music"):
                    cat = cats.setdefault(name, {})
                    cat["name"] = name
                    cat["dir"] = name
                cfg.write()
                '
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3
            env:
              TZ: Europe/London
              SABNZBD__PORT: &port 8080
              SABNZBD__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: SABNZBD_API_KEY
              SABNZBD__NZB_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: SABNZBD_API_KEY
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,sabnzbd.media,sabnzbd.media.svc,sabnzbd.media.svc.cluster.local,sabnzbd.${SECRET_DOMAIN}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
