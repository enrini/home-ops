---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  chartRef:
    kind: OCIRepository
    name: navidrome
  interval: 1h
  values:
    controllers:
      navidrome:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: v0.64.2
            env:
              TZ: Europe/London
              ND_PORT: &port 4533
              ND_DATAFOLDER: /data
              ND_MUSICFOLDER: /media/media/music
              ND_CACHEFOLDER: /cache
              ND_IMAGECACHESIZE: 256MB
              ND_TRANSCODINGCACHESIZE: 512MB
              ND_LOGLEVEL: info
              ND_LOGFORMAT: json
              ND_SCANNER_ENABLED: "true"
              ND_SCANNER_SCHEDULE: "@every 1h"
              ND_SCANNER_SCANONSTARTUP: "true"
              ND_PROMETHEUS_ENABLED: "true"
              ND_PROMETHEUS_METRICSPATH: /metrics
              ND_ENABLETRANSCODINGCONFIG: "true"
              ND_ENABLESHARING: "false"
              TMPDIR: /tmp
            envFrom:
              - secretRef:
                  name: navidrome-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
            interval: 1m
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /data
      media:
        type: persistentVolumeClaim
        existingClaim: media-data
        globalMounts:
          - path: /media
            readOnly: true
      cache:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
