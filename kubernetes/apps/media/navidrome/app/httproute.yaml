---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome
spec:
  hostnames:
    - "music.${SECRET_DOMAIN}"
  parentRefs:
    # Change to envoy-external later when exposing music externally via Cloudflare Tunnel
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: navidrome-block-metrics
    - backendRefs:
        - name: navidrome
          port: 4533
