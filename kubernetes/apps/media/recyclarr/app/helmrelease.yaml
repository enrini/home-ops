---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: "@daily"
          suspend: false
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1
            args:
              - sync
            env:
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: arr-api-keys
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      config:
        data:
          recyclarr.yml: |-
            # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
            radarr:
              movies:
                base_url: http://radarr.media.svc.cluster.local:7878
                api_key: !env_var RADARR_API_KEY
                delete_old_custom_formats: true
                media_naming:
                  folder: plex-imdb
                  movie:
                    rename: true
                    standard: plex-imdb
                quality_definition:
                  type: movie
                quality_profiles:
                  - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
                    reset_unmatched_scores:
                      enabled: true
                  - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
                    reset_unmatched_scores:
                      enabled: true
            sonarr:
              tv:
                base_url: http://sonarr.media.svc.cluster.local:8989
                api_key: !env_var SONARR_API_KEY
                delete_old_custom_formats: true
                media_naming:
                  series: plex-tvdb
                  season: default
                  episodes:
                    rename: true
                    standard: default
                    daily: default
                    anime: default
                quality_definition:
                  type: series
                quality_profiles:
                  - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
                    reset_unmatched_scores:
                      enabled: true
              anime:
                base_url: http://sonarr-anime.media.svc.cluster.local:8989
                api_key: !env_var SONARR_ANIME_API_KEY
                delete_old_custom_formats: true
                media_naming:
                  series: plex-tvdb
                  season: default
                  episodes:
                    rename: true
                    standard: default
                    daily: default
                    anime: default
                quality_definition:
                  type: anime
                quality_profiles:
                  - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
                    reset_unmatched_scores:
                      enabled: true
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
