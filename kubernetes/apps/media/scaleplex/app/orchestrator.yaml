---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaleplex-orchestrator
  namespace: media
---
apiVersion: v1
kind: Service
metadata:
  name: scaleplex-orchestrator
  namespace: media
  labels:
    app.kubernetes.io/name: scaleplex-orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scaleplex-orchestrator
  ports:
    - name: http
      port: 3500
      targetPort: 3500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaleplex-orchestrator
  namespace: media
  labels:
    app.kubernetes.io/name: scaleplex-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaleplex-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaleplex-orchestrator
    spec:
      serviceAccountName: scaleplex-orchestrator
      terminationGracePeriodSeconds: 10
      containers:
        - name: orchestrator
          image: ghcr.io/varashi/scaleplex_orchestrator:sha-bedf0e8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3500
          env:
            - name: LISTEN_ADDR
              value: ":3500"
            - name: WORKERS_DNS
              value: "scaleplex-worker.media.svc.cluster.local"
            - name: WORKER_PORT
              value: "3501"
            - name: WORKERS_REFRESH_SECONDS
              value: "5"
            - name: WORKERS_PROBE_SECONDS
              value: "5"
            - name: SCALEPLEX_PREFER_HW
              value: "1"
            - name: SCALEPLEX_LB_STRATEGY
              value: "load"
            - name: SCALEPLEX_RECOVERY_WAIT_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
