---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaleplex-worker
  namespace: media
---
apiVersion: v1
kind: Service
metadata:
  name: scaleplex-worker
  namespace: media
  labels:
    app.kubernetes.io/name: scaleplex-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: scaleplex-worker
  ports:
    - name: http
      port: 3501
      targetPort: 3501
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scaleplex-worker
  namespace: media
  labels:
    app.kubernetes.io/name: scaleplex-worker
spec:
  minReadySeconds: 30
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaleplex-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaleplex-worker
    spec:
      serviceAccountName: scaleplex-worker
      terminationGracePeriodSeconds: 30
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        supplementalGroups:
          - 44
          - 105
          - 568
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: transcode
          persistentVolumeClaim:
            claimName: plex-transcode
      containers:
        - name: agent
          image: ghcr.io/varashi/scaleplex_worker:sha-bedf0e8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3501
          env:
            - name: WORKER_BACKEND
              value: "auto"
            - name: SCALEPLEX_FORCE_HW
              value: "1"
            - name: SCALEPLEX_TONEMAP
              value: "opencl"
            - name: SCALEPLEX_DRAIN_SECONDS
              value: "10"
          securityContext:
            capabilities:
              add:
                - PERFMON
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: transcode
              mountPath: /transcode
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              gpu.intel.com/i915: 1
            limits:
              memory: 4Gi
              gpu.intel.com/i915: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
