---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arr-config
spec:
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
    - name: prowlarr
    - name: radarr
    - name: sonarr
    - name: sonarr-anime
    - name: lidarr
    - name: qbittorrent
    - name: sabnzbd
    - name: byparr
    - name: unpackerr
  interval: 1h
  path: ./kubernetes/apps/media/arr-config/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
